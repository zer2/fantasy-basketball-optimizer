<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Sports Optimizer</title>
    <link rel = 'stylesheet' href = 'styles/styles.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="app-layout">

        <aside id="sidebar" style="visibility: hidden">
            <div class="sidebar-title">Fantasy Sports Optimizer</div>
            <hr class="sidebar-divider">
            <div id="sidebar-sections"></div>
        </aside>

        <main id="main-content">

            <!-- Season tab bar (Season mode only) -->
            <nav id="season-nav" style="display:none"></nav>

            <!-- Live data controls (Draft/Auction + live platform only) -->
            <div id="live-bar" style="display:none"></div>

            <!-- Standard content row: optional left panel + candidate panel -->
            <div id="content-row">
                <div id="left-panel" style="display:none"></div>
                <div id="candidate-panel">
                    <div id="right-header"></div>
                    <div id="right-sub-header"></div>
                    <table id="hscoretable"><tbody></tbody></table>
                    <div id="auction-gscore" style="display:none"></div>
                    <div id="draft-gscore"   style="display:none"></div>
                    <div id="right-footer"></div>
                </div>
            </div>

            <!-- Season Rosters two-col (replaces content-row for Rosters tab) -->
            <div id="season-rosters-row" style="display:none">
                <div id="rosters-left"></div>
                <div id="rosters-right"></div>
            </div>

            <!-- Season Trading placeholder -->
            <div id="season-trading-row" style="display:none">
                <p class="coming-soon">Trading — coming soon</p>
            </div>

        </main>

    </div>

    <script src = 'dist/main.js' type = 'module'></script>

</body>
</html>
