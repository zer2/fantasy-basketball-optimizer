    aleph :
      default : 0.2
      min : 0.0
      max: 1.0
    kappa :
      default : 0.3
      min : 0.0
      max: 5.0
    most_categories_weight :
      # How much of the Head-to-Head objective is the probability of taking the majority of
      # categories, the rest being the average per-category win probability. 0 reproduces Each
      # Category exactly and 1 reproduces Most Categories exactly; in between the two objectives
      # are blended, which is coherent because both are probabilities on the same scale — an Each
      # Category matchup is one where every category is its own contest, a Most Categories matchup
      # one where they are settled together. Defaults to 0, so a new session drafts to Each
      # Category as it always has. Ignored (and pinned to None) under Rotisserie.
      default : 0.0
      min : 0.0
      max: 1.0
    behavior_model_confidence :
      # Halves how sharply opponents are expected to pursue their predicted punts. 0.5 softens the
      # self-play field enough that best responses stop crowding into a single open punt lane
      # (measured: cold-start herding collapses from 10/12 seats to 3/12 and the field gains a
      # stable interior assists share), which is also what makes the hybrid start policy's early
      # cold-scan window safe. 1 = full self-play equilibrium; 0 = category-neutral opponents.
      default : 0.5
      min : 0.0
      max: 1.0
    beth:
      default : 3
      min : 0
      max:
    n_iterations :
      default : 30
      min : 0
      max: 10000
    S: 
      default : 10
      min : 0
      max : 200
