# Manim reads this when it is run from the repository root, which is how every render command
# in visualizations/README.md is written. Without it Manim writes to ./media, putting renders
# outside visualizations/ and outside the ignore rules that keep its intermediates untracked.
[CLI]
media_dir = visualizations/media

# Manim renders each animation to its own file under partial_movie_files/ and stitches them at
# the end. It also trims that directory to max_files_cached, which DEFAULTS TO 100 -- and Most
# Categories plays a hundred and forty-seven animations.
#
# When a scene has more animations than this, the trim deletes partials, and the concatenation
# list along with them, while they are still needed. Manim does not fail: it writes an mp4 that
# reports the full duration and contains only what survived. The last broken Most Categories
# render claimed four and a half minutes and held 624 frames -- forty-one seconds at fifteen
# frames a second -- with no error anywhere in the log.
#
# Set well above the largest scene so the trim can never reach a file the stitch needs.
max_files_cached = 500
